name: EIP-8200 BLAKE2f Benchmark
run-name: EIP-8200 BLAKE2f benchmark

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: eip8200-blake2f-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    uses: ./.github/workflows/_benchmark-track.yml
    with:
      track: blake2f
