name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, verify, score
    runs-on: warp-ubuntu-2404-x64-32x
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Change the dependency cache only when this repository's import surface
      # changes. Ordinary proof edits can reuse the same package build, while a
      # new import gets a fresh key that can save the expanded closure.
      - name: Fingerprint Lean imports
        id: lean-imports
        run: |
          import_hash="$({ git grep --no-color '^import ' -- '*.lean' || true; } | sort | sha256sum | cut -d' ' -f1)"
          echo "hash=$import_hash" >> "$GITHUB_OUTPUT"

      # Cache this repository separately from its pinned dependencies. The
      # restore prefix gives Lake a safe incremental base after source edits.
      - name: Cache compiled project build
        uses: actions/cache@v5
        with:
          path: .lake/build
          key: project-lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('Challenge/**/*.lean', 'Challenge.lean', 'Checks.lean', 'Main.lean', 'lakefile.toml') }}
          restore-keys: |
            project-lake-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      # Preserve complete package workspaces, including Git metadata. Caching
      # only their build directories makes Lake regard the restored packages
      # as invalid checkouts and delete the artifacts before building.
      - name: Cache pinned packages
        id: package-cache
        uses: actions/cache@v5
        with:
          path: .lake/packages
          key: lake-packages-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ steps.lean-imports.outputs.hash }}
          restore-keys: |
            lake-packages-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Build (fetch Mathlib cache on cold start + lake build)
        uses: leanprover/lean-action@v1
        with:
          # `cache-hit` is empty only for a total miss; it is `false` for a
          # restore-prefix hit, whose complete workspace already has Mathlib.
          use-mathlib-cache: ${{ steps.package-cache.outputs.cache-hit == '' }}
          build: "true"
          test: "false"
          lint: "false"
          use-github-cache: "false"

      # A proof is only a proof if its axiom footprint is the standard one.
      # Checks.lean pins it with `#guard_msgs`, so a `sorry` (`sorryAx`) or a
      # `native_decide` (`Lean.ofReduceBool`) fails the job. The textual scan
      # catches an unfinished proof in a file Checks.lean does not reach.
      - name: Verify soundness (axiom footprint, no unfinished proofs)
        run: |
          if grep -rn --include='*.lean' -w 'sorry' Challenge Challenge.lean Main.lean; then
            echo "::error::found an unfinished proof"
            exit 1
          fi
          lake env lean Checks.lean

      # `reference.hex` is the frozen Route-B artifact. The compiler is only
      # its reproducible generator; no Route-B theorem uses compiler soundness.
      - name: Verify frozen reference bytecode
        run: |
          compiled="$(lake exe yulc Challenge/Sha256/reference.yul)"
          frozen="$(tr -d '[:space:]' < Challenge/Sha256/reference.hex)"
          literal="$(lake exe sha256challenge --print-reference-hex)"
          if [ "$compiled" != "$frozen" ] || [ "$literal" != "$frozen" ]; then
            echo "::error::reference.hex is stale"
            exit 1
          fi

      # Tier 1: the reference implementation must still compile through the
      # verified compiler and return exactly EvmSemantics.Crypto.Sha256.hash on
      # every FIPS and padding-boundary vector, in a clean frame and a dirty
      # one. This also pins the reference's gas in the job log.
      - name: Tier 1 — score the reference implementation
        run: |
          lake build sha256challenge
          lake exe sha256challenge

      # The scorer must be able to reject: a candidate that returns 32 zero
      # bytes has to fail every vector. A green Tier-1 gate that cannot fail
      # is worse than no gate.
      - name: Tier 1 — negative control
        run: |
          printf '60206000f3' > /tmp/zeros.hex
          if lake exe sha256challenge --hex=/tmp/zeros.hex; then
            echo "::error::the scorer accepted a candidate returning 32 zero bytes"
            exit 1
          fi
