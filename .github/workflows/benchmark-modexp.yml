name: EIP-8200 MODEXP Benchmark
run-name: EIP-8200 MODEXP benchmark

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: eip8200-modexp-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    uses: ./.github/workflows/_benchmark-track.yml
    with:
      track: modexp
    secrets:
      benchmark-vectors: ${{ secrets.MODEXP_BENCHMARK_VECTORS }}
